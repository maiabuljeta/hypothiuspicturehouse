<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chart Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .chart-container {
            position: relative;
            margin: 2rem 0;
            height: 400px;
        }
        input, select, button {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            background: #4361ee;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #3048c4;
        }
        #dataInputs {
            display: grid;
            gap: 1rem;
        }
        .data-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 1rem;
        }
        .remove-btn {
            background: #ef4444;
        }
        .remove-btn:hover {
            background: #dc2626;
        }
        #downloadSection {
            margin-top: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chart Generator</h1>
        
        <div class="input-section">
            <div>
                <input type="text" id="chartTitle" placeholder="Chart Title" style="width: 100%;">
            </div>
            <div>
                <select id="chartType" style="width: 100%;">
                    <option value="bar">Bar Chart</option>
                    <option value="pie">Pie Chart</option>
                </select>
            </div>
        </div>

        <div id="dataInputs">
            <div class="data-row">
                <input type="text" placeholder="Label" class="label-input">
                <input type="number" placeholder="Value" class="value-input">
                <button class="remove-btn" onclick="removeRow(this)">×</button>
            </div>
        </div>

        <button onclick="addRow()" style="margin-top: 1rem;">Add Data Point</button>
        <button onclick="generateChart()" style="margin-top: 1rem;">Generate Chart</button>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>

        <div id="downloadSection">
            <button onclick="downloadChart()">Download as JPEG</button>
        </div>
    </div>

    <script>
        let chart = null;

        function addRow() {
            const dataInputs = document.getElementById('dataInputs');
            const newRow = document.createElement('div');
            newRow.className = 'data-row';
            newRow.innerHTML = `
                <input type="text" placeholder="Label" class="label-input">
                <input type="number" placeholder="Value" class="value-input">
                <button class="remove-btn" onclick="removeRow(this)">×</button>
            `;
            dataInputs.appendChild(newRow);
        }

        function removeRow(button) {
            button.parentElement.remove();
        }

        function generateChart() {
            const chartTitle = document.getElementById('chartTitle').value || 'Chart';
            const chartType = document.getElementById('chartType').value;
            const labelInputs = document.getElementsByClassName('label-input');
            const valueInputs = document.getElementsByClassName('value-input');

            const labels = Array.from(labelInputs).map(input => input.value || 'Unnamed');
            const values = Array.from(valueInputs).map(input => parseFloat(input.value) || 0);
            const total = values.reduce((a, b) => a + b, 0);
            const percentages = values.map(value => ((value / total) * 100).toFixed(1));

            // Generate random colors
            const colors = values.map(() => 
                `hsl(${Math.random() * 360}, 70%, 60%)`
            );

            const ctx = document.getElementById('myChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }

            const config = {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: chartTitle,
                            font: {
                                size: 18
                            }
                        },
                        legend: {
                            position: 'right',
                            labels: {
                                generateLabels: function(chart) {
                                    const data = chart.data;
                                    if (data.labels.length && data.datasets.length) {
                                        return data.labels.map((label, i) => ({
                                            text: `${label} (${percentages[i]}%)`,
                                            fillStyle: data.datasets[0].backgroundColor[i],
                                            hidden: isNaN(data.datasets[0].data[i]),
                                            index: i
                                        }));
                                    }
                                    return [];
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.raw;
                                    const percentage = percentages[context.dataIndex];
                                    return `${context.label}: ${value} (${percentage}%)`;
                                }
                            }
                        },
                        datalabels: {
                            display: true,
                            color: 'white',
                            font: {
                                weight: 'bold'
                            },
                            formatter: (value, ctx) => {
                                const percentage = percentages[ctx.dataIndex];
                                return `${percentage}%`;
                            }
                        }
                    }
                },
                plugins: [{
                    id: 'percentageLabels',
                    afterDraw: function(chart) {
                        const ctx = chart.ctx;
                        ctx.save();
                        ctx.font = 'bold 12px system-ui';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        
                        if (chart.config.type === 'pie') {
                            // Add percentages to pie chart
                            chart.data.datasets[0].data.forEach((value, i) => {
                                const meta = chart.getDatasetMeta(0);
                                const arc = meta.data[i];
                                const centerPoint = arc.getCenterPoint();
                                
                                // White text with black outline for better visibility
                                ctx.strokeStyle = 'black';
                                ctx.lineWidth = 3;
                                ctx.strokeText(`${percentages[i]}%`, centerPoint.x, centerPoint.y);
                                ctx.fillStyle = 'white';
                                ctx.fillText(`${percentages[i]}%`, centerPoint.x, centerPoint.y);
                            });
                        } else if (chart.config.type === 'bar') {
                            // Add percentages to bar chart
                            chart.data.datasets[0].data.forEach((value, i) => {
                                const meta = chart.getDatasetMeta(0);
                                const bar = meta.data[i];
                                
                                // Position the percentage above each bar
                                ctx.strokeStyle = 'black';
                                ctx.lineWidth = 3;
                                ctx.strokeText(`${percentages[i]}%`, bar.x, bar.y - 10);
                                ctx.fillStyle = 'white';
                                ctx.fillText(`${percentages[i]}%`, bar.x, bar.y - 10);
                            });
                        }
                        ctx.restore();
                    }
                }]
            };

            chart = new Chart(ctx, config);
        }

        function downloadChart() {
            // Create a temporary canvas with a white background
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            const originalCanvas = document.getElementById('myChart');
            
            // Set the temporary canvas to the same size as the chart
            tempCanvas.width = originalCanvas.width;
            tempCanvas.height = originalCanvas.height;
            
            // Fill with white background
            tempCtx.fillStyle = 'white';
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            
            // Draw the original chart onto the temporary canvas
            tempCtx.drawImage(originalCanvas, 0, 0);
            
            // Create download link
            const link = document.createElement('a');
            link.download = 'chart.jpeg';
            
            // Convert to JPEG with white background
            link.href = tempCanvas.toDataURL('image/jpeg', 1.0);
            
            // Trigger download
            link.click();
        }

        // Initialize with one row
        generateChart();
    </script>
</body>
</html>
