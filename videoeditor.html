<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Browser Video Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.1"></script>
    <style>
        #timeline { width: 80%; height: 100px; background-color: #ccc; position: relative; margin-top: 10px; }
        #playhead { width: 2px; height: 100px; background: red; position: absolute; top: 0; left: 0; }
        #mouse-line { width: 2px; height: 100px; background: green; position: absolute; top: 0; display: none; }
        #clips-container { margin-top: 20px; display: flex; gap: 10px; }
        .clip { background-color: lightblue; padding: 5px; cursor: move; border: 1px solid #000; }
    </style>
</head>
<body>
    <h1>Advanced Browser Video Editor</h1>

    <input type="file" id="video-upload" accept="video/*">
    <br><br>

    <!-- Video preview -->
    <video id="video-preview" controls style="width: 500px;"></video>
    <br><br>

    <!-- Playhead and timeline -->
    <div id="timeline">
        <div id="playhead"></div>
        <div id="mouse-line"></div>
    </div>
    <br>

    <!-- Input for trimming times -->
    <label for="start-time">Start Time (seconds):</label>
    <input type="number" id="start-time" value="0" step="0.1">
    
    <label for="end-time">End Time (seconds):</label>
    <input type="number" id="end-time" value="5" step="0.1">
    
    <button id="add-cut-button">Add Cut</button>
    <br><br>

    <!-- Clips after cuts -->
    <div id="clips-container"></div>
    
    <button id="trim-button" onclick="exportEditedVideo()">Export Edited Video</button>
    <br><br>

    <!-- Download link for the processed video -->
    <a id="download-link" style="display: none;">Download Edited Video</a>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });
        const videoPreview = document.getElementById('video-preview');
        let uploadedVideo;
        let cuts = []; // Store the start and end times of each cut
        let clips = [];

        // Load video preview when file is uploaded
        document.getElementById('video-upload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            uploadedVideo = file;
            const videoURL = URL.createObjectURL(file);
            videoPreview.src = videoURL;
        });

        // Add cuts
        document.getElementById('add-cut-button').addEventListener('click', () => {
            const startTime = parseFloat(document.getElementById('start-time').value);
            const endTime = parseFloat(document.getElementById('end-time').value);
            cuts.push({ startTime, endTime });

            // Reflect cuts visually by adding clips
            const clip = document.createElement('div');
            clip.className = 'clip';
            clip.innerText = `Clip: ${startTime} - ${endTime}`;
            clip.draggable = true; // Allow clips to be draggable
            document.getElementById('clips-container').appendChild(clip);

            clips.push(clip);

            // Adjust the timeline to reflect cuts
            document.getElementById('timeline').style.backgroundColor = '#f0f0f0';
        });

        // Playhead moves as video plays
        videoPreview.addEventListener('timeupdate', function() {
            const timelineWidth = document.getElementById('timeline').offsetWidth;
            const playhead = document.getElementById('playhead');
            const playPercent = videoPreview.currentTime / videoPreview.duration;
            playhead.style.left = `${playPercent * timelineWidth}px`;
        });

        // Mouse-following line on the timeline
        document.getElementById('timeline').addEventListener('mousemove', function(event) {
            const mouseLine = document.getElementById('mouse-line');
            mouseLine.style.display = 'block';
            mouseLine.style.left = `${event.offsetX}px`;
        });

        document.getElementById('timeline').addEventListener('mouseleave', function() {
            document.getElementById('mouse-line').style.display = 'none';
        });

        async function exportEditedVideo() {
            if (!uploadedVideo || cuts.length === 0) {
                alert('Please upload a video and make at least one cut!');
                return;
            }

            await ffmpeg.load();
            // Read the uploaded video file into FFmpeg
            ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(uploadedVideo));

            // Process each cut
            let outputVideos = [];
            for (let i = 0; i < cuts.length; i++) {
                const { startTime, endTime } = cuts[i];
                await ffmpeg.run('-i', 'input.mp4', '-ss', startTime.toString(), '-to', endTime.toString(), '-c', 'copy', `output${i}.mp4`);
                const data = ffmpeg.FS('readFile', `output${i}.mp4`);
                outputVideos.push(new Blob([data.buffer], { type: 'video/mp4' }));
            }

            // Concatenate the output videos into one final video
            const finalVideoBlob = new Blob(outputVideos, { type: 'video/mp4' });
            const finalVideoURL = URL.createObjectURL(finalVideoBlob);

            // Set up the download link
            const downloadLink = document.getElementById('download-link');
            downloadLink.href = finalVideoURL;
            downloadLink.download = 'edited_video.mp4';
            downloadLink.style.display = 'block';
            downloadLink.innerText = 'Download Edited Video';
        }
    </script>
</body>
</html>
