<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.5.0-beta4/html2canvas.min.js"></script>
    <style>
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .app-container {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .controls {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-weight: 500;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #3d3d3d;
            border: 1px solid #4d4d4d;
            color: white;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #e50914;
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.2);
        }

        .file-upload {
            background-color: #3d3d3d;
            border: 2px dashed #4d4d4d;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: #e50914;
            background-color: #444;
        }

        .file-upload i {
            font-size: 2em;
            margin-bottom: 10px;
            color: #e50914;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .primary-btn {
            background-color: #e50914;
            color: white;
        }

        .secondary-btn {
            background-color: #333;
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.2);
        }

        .poster-container {
            position: relative;
        }

        .poster {
            width: 400px;
            height: 600px;
            background-color: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        .poster-content {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            box-sizing: border-box;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0,0,0,0.5) 50%,
                rgba(0,0,0,0.95) 100%
            );
        }

        .poster-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.5s ease;
        }

        .movie-title {
            font-size: 2.8em;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            line-height: 1.1;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 1.2em;
            margin: 15px 0;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            opacity: 0.9;
        }

        .credits {
            font-size: 0.9em;
            margin: 5px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .rating {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid #e50914;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .effects {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background: 
                linear-gradient(45deg, rgba(229,9,20,0.1) 0%, transparent 100%),
                linear-gradient(-45deg, rgba(0,0,0,0.2) 0%, transparent 100%);
            mix-blend-mode: overlay;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="controls">
            <div class="input-group">
                <label for="movieTitle">Movie Title</label>
                <input type="text" id="movieTitle" value="THE ETERNAL HORIZON">
            </div>
            <div class="input-group">
                <label for="tagline">Tagline</label>
                <input type="text" id="tagline" value="Beyond the stars lies humanity's greatest challenge">
            </div>
            <div class="input-group">
                <label for="director">Director</label>
                <input type="text" id="director" value="JAMES CAMERON">
            </div>
            <div class="input-group">
                <label for="starring">Starring</label>
                <input type="text" id="starring" value="BRAD PITT · JENNIFER LAWRENCE · IDRIS ELBA">
            </div>
            <div class="input-group">
                <label for="rating">Rating</label>
                <select id="rating">
                    <option value="G">G</option>
                    <option value="PG">PG</option>
                    <option value="PG-13" selected>PG-13</option>
                    <option value="R">R</option>
                </select>
            </div>
            <div class="input-group">
                <label>Poster Image</label>
                <div class="file-upload" onclick="document.getElementById('imageInput').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Click to upload image</p>
                    <input type="file" id="imageInput" accept="image/*" style="display: none">
                </div>
            </div>
            <div class="button-group">
                <button class="primary-btn" onclick="updatePoster()">
                    <i class="fas fa-sync-alt"></i> Update
                </button>
                <button class="secondary-btn" onclick="downloadPoster()">
                    <i class="fas fa-download"></i> Download
                </button>
            </div>
        </div>

        <div class="poster-container">
            <div class="poster" id="poster">
                <img class="poster-image" id="posterImage" src="/api/placeholder/400/600" alt="Movie Poster Background">
                <div class="poster-content">
                    <div class="rating" id="ratingDisplay">PG-13</div>
                    <h1 class="movie-title" id="titleDisplay">THE ETERNAL HORIZON</h1>
                    <p class="tagline" id="taglineDisplay">Beyond the stars lies humanity's greatest challenge</p>
                    <p class="credits">DIRECTED BY <span id="directorDisplay">JAMES CAMERON</span></p>
                    <p class="credits">STARRING <span id="starringDisplay">BRAD PITT · JENNIFER LAWRENCE · IDRIS ELBA</span></p>
                </div>
                <div class="effects"></div>
            </div>
        </div>
    </div>

    <div class="loading">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Processing your poster...</p>
        </div>
    </div>

    <script>
        // Handle image upload
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('posterImage').src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Update poster content
        function updatePoster() {
            document.getElementById('titleDisplay').textContent = document.getElementById('movieTitle').value.toUpperCase();
            document.getElementById('taglineDisplay').textContent = document.getElementById('tagline').value;
            document.getElementById('directorDisplay').textContent = document.getElementById('director').value.toUpperCase();
            document.getElementById('starringDisplay').textContent = document.getElementById('starring').value.toUpperCase();
            document.getElementById('ratingDisplay').textContent = document.getElementById('rating').value;
        }

        // Download poster as JPEG
        function downloadPoster() {
            const loading = document.querySelector('.loading');
            loading.style.display = 'flex';

            const poster = document.getElementById('poster');
            
            html2canvas(poster, {
                useCORS: true,
                scale: 2,
                allowTaint: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'movie-poster.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
                loading.style.display = 'none';
            });
        }
    </script>
</body>
</html>
