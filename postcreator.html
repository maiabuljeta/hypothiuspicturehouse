<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>True 3D Text with Three.js</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f0f0;
        }

        canvas {
            display: block;
        }

        #container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js"></script>
    <script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
    <script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>

    <script>
        let scene, camera, renderer, textMesh;

        // Initialize Three.js scene
        function init() {
            scene = new THREE.Scene();

            // Set up a basic perspective camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 200;

            // Create the WebGL renderer and attach it to the container
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // Add lights to the scene
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.8);
            pointLight.position.set(50, 50, 100);
            scene.add(pointLight);

            // Load a font and create 3D text
            const loader = new THREE.FontLoader();
            loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (font) {
                const textGeometry = new THREE.TextGeometry('3D Text', {
                    font: font,
                    size: 40,
                    height: 10,
                    curveSegments: 12,
                    bevelEnabled: true,
                    bevelThickness: 1,
                    bevelSize: 1,
                    bevelOffset: 0,
                    bevelSegments: 5
                });

                // Create a material for the text
                const textMaterial = new THREE.MeshPhongMaterial({
                    color: 0x0095f6, // Choose any color for the text
                    shininess: 50
                });

                // Create the text mesh and add it to the scene
                textMesh = new THREE.Mesh(textGeometry, textMaterial);
                textMesh.position.set(-100, 0, 0);
                scene.add(textMesh);

                animate();
            });
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate the text for a cool effect
            textMesh.rotation.x += 0.01;
            textMesh.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        // Adjust the renderer and camera when resizing the window
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        init();
    </script>
</body>
</html>
