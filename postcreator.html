<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InstantPost - Quick Instagram Post Creator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .canvas-container {
            position: relative;
            width: 600px;
            height: 600px;
            margin: 0 auto;
        }

        #post-canvas {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        .text-layer {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotateX(15deg) rotateY(10deg); /* 3D rotation */
        text-align: center;
        width: 80%;
        transition: all 0.3s ease;
        color: #ffffff; /* Main text color */
        font-size: 60px;
        font-weight: bold; /* For a stronger text */
        text-shadow: 
            1px 1px 2px rgba(0, 0, 0, 0.3); /* Lighter shadow for a more realistic feel */
        perspective: 1000px; /* Creating 3D depth */
    }
        }

        button {
            background: #0095f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #0081d6;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .template {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .template:hover {
            border-color: #0095f6;
            transform: translateY(-2px);
        }

        .color-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="control-group">
                <label>Quick Templates</label>
                <div class="template-grid">
                    <div class="template" onclick="applyTemplate('minimal')">Minimal</div>
                    <div class="template" onclick="applyTemplate('bold')">Bold</div>
                    <div class="template" onclick="applyTemplate('gradient')">Gradient</div>
                    <div class="template" onclick="applyTemplate('quote')">Quote</div>
                </div>
            </div>

            <div class="control-group">
                <label>Text Content</label>
                <textarea id="text-input" rows="4" placeholder="Enter your text here...">Your amazing caption here</textarea>
            </div>

            <div class="control-group">
                <label>Font Style</label>
                <select id="font-select" onchange="updateStyle()">
                    <option value="'Segoe UI'">Modern</option>
                    <option value="Georgia">Classic</option>
                    <option value="'Arial Black'">Bold</option>
                    <option value="'Brush Script MT'">Script</option>
                </select>
            </div>

            <div class="control-group">
                <label>Colors</label>
                <div class="color-picker">
                    <div class="color-swatch" style="background: #ff6b6b" onclick="setColor('#ff6b6b')"></div>
                    <div class="color-swatch" style="background: #4ecdc4" onclick="setColor('#4ecdc4')"></div>
                    <div class="color-swatch" style="background: #45b7d1" onclick="setColor('#45b7d1')"></div>
                    <div class="color-swatch" style="background: #96ceb4" onclick="setColor('#96ceb4')"></div>
                    <div class="color-swatch" style="background: #d4a5a5" onclick="setColor('#d4a5a5')"></div>
                </div>
            </div>

            <div class="control-group">
                <label>Text Size</label>
                <input type="range" min="20" max="80" value="40" id="size-slider" onchange="updateStyle()">
            </div>

            <button onclick="downloadPost()" style="width: 100%; margin-top: 20px;">Download Post</button>
        </div>

        <div class="canvas-container">
            <div id="post-canvas">
                <div class="text-layer" id="text-layer">Your amazing caption here</div>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const textLayer = document.getElementById('text-layer');
        const fontSelect = document.getElementById('font-select');
        const sizeSlider = document.getElementById('size-slider');
        let currentColor = '#ffffff'; // Set to white for 3D effect

        textInput.addEventListener('input', (e) => {
            textLayer.innerText = e.target.value;
        });

        function updateStyle() {
            textLayer.style.fontFamily = fontSelect.value;
            textLayer.style.fontSize = `${sizeSlider.value}px`;
            textLayer.style.color = currentColor;
            textLayer.style.textShadow = 
                `2px 2px 0px ${shadeColor(currentColor, -20)}, 
                4px 4px 0px ${shadeColor(currentColor, -40)}, 
                6px 6px 0px ${shadeColor(currentColor, -60)}`; // Use shades for depth
        }

        function setColor(color) {
            currentColor = color;
            updateStyle();
        }

        function shadeColor(color, percent) {
            const num = parseInt(color.slice(1), 16),
                amt = Math.round(2.55 * percent),
                R = (num >> 16) + amt,
                G = (num >> 8 & 0x00FF) + amt,
                B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 + (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 + (B < 255 ? (B < 1 ? 0 : B) : 255)).toString(16).slice(1);
        }

        function applyTemplate(type) {
            const canvas = document.getElementById('post-canvas');
            switch (type) {
                case 'minimal':
                    canvas.style.background = '#ffffff';
                    break;
                case 'bold':
                    canvas.style.background = '#f8f9fa';
                    textLayer.style.color = '#000000';
                    break;
                case 'gradient':
                    canvas.style.background = 'linear-gradient(135deg, #ff6b6b, #4ecdc4)';
                    textLayer.style.color = '#ffffff';
                    break;
                case 'quote':
                    canvas.style.background = '#f8f9fa';
                    textLayer.style.color = '#333333';
                    textLayer.style.fontFamily = "'Brush Script MT'";
                    break;
            }
            updateStyle();
        }

        function downloadPost() {
            html2canvas(document.getElementById('post-canvas')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'instagram_post.png';
                link.href = canvas.toDataURL();
                link.click();
            });

            function update3DTextRotation(xAngle, yAngle) {
    textLayer.style.transform = `translate(-50%, -50%) rotateX(${xAngle}deg) rotateY(${yAngle}deg)`;
}

// Example usage (could be tied to sliders or button inputs for dynamic 3D manipulation)
update3DTextRotation(15, 10); // Change these values to adjust the rotation.

        }
    </script>
</body>
</html>
