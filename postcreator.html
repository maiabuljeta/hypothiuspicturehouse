<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InstantPost - Quick Instagram Post Creator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Original styles remain the same */
        /* ... (keep all your original styles) ... */

        /* Add new graphics styles */
        .graphics-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .text-layer {
            z-index: 1;
            background: transparent;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
            transition: all 0.3s ease;
        }

        .emphasis {
            font-size: 1.5em;
            font-weight: bold;
            display: inline-block;
            transform: scale(1.2);
            margin: 0 5px;
        }

        .graphic {
            position: absolute;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Keep your existing HTML structure -->

    <script>
        const textInput = document.getElementById('text-input');
        const textLayer = document.getElementById('text-layer');
        const fontSelect = document.getElementById('font-select');
        const sizeSlider = document.getElementById('size-slider');
        let currentColor = '#333333';

        // Initialize graphics when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            initializeGraphics();
            addGraphics();
        });

        function initializeGraphics() {
            const canvas = document.getElementById('post-canvas');
            if (!document.querySelector('.graphics-layer')) {
                const graphicsLayer = document.createElement('div');
                graphicsLayer.className = 'graphics-layer';
                canvas.insertBefore(graphicsLayer, canvas.firstChild);
            }
        }

        function addGraphics() {
            const graphicsLayer = document.querySelector('.graphics-layer');
            const textLayer = document.getElementById('text-layer');
            const textLength = textLayer.innerText.length;
            
            graphicsLayer.innerHTML = '';
            
            const graphicCount = Math.min(Math.ceil(textLength / 50), 5);
            
            const patterns = [
                { shape: '●', color: currentColor, size: '20px' },
                { shape: '■', color: currentColor, size: '25px' },
                { shape: '▲', color: currentColor, size: '22px' },
                { shape: '◆', color: currentColor, size: '24px' },
                { shape: '○', color: currentColor, size: '28px' }
            ];
            
            for (let i = 0; i < graphicCount; i++) {
                const graphic = document.createElement('div');
                graphic.className = 'graphic';
                
                const pattern = patterns[i % patterns.length];
                graphic.style.cssText = `
                    font-size: ${pattern.size};
                    color: ${pattern.color};
                    opacity: 0.15;
                    top: ${Math.random() * 80 + 10}%;
                    left: ${Math.random() * 80 + 10}%;
                    transform: rotate(${Math.random() * 360}deg);
                `;
                graphic.textContent = pattern.shape;
                graphicsLayer.appendChild(graphic);
            }
        }

        function emphasizeWords() {
            const textLayer = document.getElementById('text-layer');
            const words = textLayer.innerText.split(' ');
            
            const emphasizedHTML = words.map(word => {
                if (word.startsWith('*') && word.endsWith('*')) {
                    return `<span class="emphasis">${word.slice(1, -1)}</span>`;
                } else if (word === word.toUpperCase() && word.length > 1) {
                    return `<span class="emphasis">${word}</span>`;
                }
                return word;
            }).join(' ');
            
            textLayer.innerHTML = emphasizedHTML;
        }

        // Modified event listeners and functions
        textInput.addEventListener('input', (e) => {
            textLayer.innerText = e.target.value;
            emphasizeWords();
            addGraphics();
        });

        function updateStyle() {
            textLayer.style.fontFamily = fontSelect.value;
            textLayer.style.fontSize = `${sizeSlider.value}px`;
            textLayer.style.color = currentColor;
            addGraphics();
        }

        function setColor(color) {
            currentColor = color;
            updateStyle();
        }

        function applyTemplate(type) {
            const canvas = document.getElementById('post-canvas');
            const textLayer = document.getElementById('text-layer');

            switch(type) {
                case 'minimal':
                    canvas.style.background = '#ffffff';
                    textLayer.style.color = '#333333';
                    textLayer.style.fontFamily = "'Segoe UI'";
                    break;
                case 'bold':
                    canvas.style.background = '#000000';
                    textLayer.style.color = '#ffffff';
                    textLayer.style.fontFamily = "'Arial Black'";
                    textLayer.style.letterSpacing = '2px';
                    break;
                case 'gradient':
                    canvas.style.background = 'linear-gradient(45deg, #ff6b6b, #4ecdc4)';
                    textLayer.style.color = '#ffffff';
                    textLayer.style.textShadow = '2px 2px 4px rgba(0,0,0,0.3)';
                    break;
                case 'quote':
                    canvas.style.background = '#f8f9fa';
                    textLayer.style.color = '#333333';
                    textLayer.style.fontFamily = 'Georgia';
                    textLayer.style.fontStyle = 'italic';
                    textInput.value = '"' + textInput.value + '"';
                    textLayer.innerText = textInput.value;
                    break;
            }
            addGraphics();
        }

        // Keep your existing downloadPost function
        async function downloadPost() {
            const canvas = document.getElementById('post-canvas');
            try {
                const capturedCanvas = await html2canvas(canvas);
                const link = document.createElement('a');
                link.download = 'instagram-post.png';
                link.href = capturedCanvas.toDataURL();
                link.click();
            } catch (error) {
                console.error('Error generating image:', error);
                alert('There was an error generating your image. Please try again.');
            }
        }

        // Initialize with default styles
        updateStyle();
    </script>
</body>
</html>
